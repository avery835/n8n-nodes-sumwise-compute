name: Publish reviewed package
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact public main commit that has been reviewed and approved
        required: true
        type: string
      version:
        description: Exact package.json version approved for publication
        required: true
        type: string
      reviewed_package_sha256:
        description: SHA-256 of the independently inspected same-SHA CI npm tarball
        required: true
        type: string
      authentication:
        description: Trusted publisher after setup, or separately authorized short-lived token
        required: true
        type: choice
        default: trusted
        options: [trusted, bootstrap-token]
permissions:
  contents: read
concurrency:
  group: initial-npm-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'avery835/n8n-nodes-sumwise-compute' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Verify reviewed identity, ref, source and version
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          REVIEWED_PACKAGE_SHA256: ${{ inputs.reviewed_package_sha256 }}
          AUTHENTICATION_MODE: ${{ inputs.authentication }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const p = require('./package.json');
          assert.equal(process.env.GITHUB_REPOSITORY, 'avery835/n8n-nodes-sumwise-compute');
          assert.equal(process.env.GITHUB_REF, 'refs/heads/main');
          assert.match(process.env.REVIEWED_SHA, /^[0-9a-f]{40}$/);
          assert.match(process.env.REVIEWED_PACKAGE_SHA256, /^[0-9a-f]{64}$/);
          assert.ok(['trusted', 'bootstrap-token'].includes(process.env.AUTHENTICATION_MODE));
          assert.equal(process.env.GITHUB_SHA, process.env.REVIEWED_SHA);
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim(), process.env.REVIEWED_SHA);
          assert.equal(p.name, 'n8n-nodes-sumwise-compute');
          assert.equal(p.version, process.env.EXPECTED_VERSION);
          assert.equal(p.version, '0.1.0');
          assert.equal(p.repository.url, 'git+https://github.com/avery835/n8n-nodes-sumwise-compute.git');
          assert.equal(p.license, 'MIT');
          assert.notEqual(p.private, true);
          NODE
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run check:package
      - run: npm run check:source
      - name: Verify tooling and unchanged checked-out source
        run: |
          node -e "const v=require('child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if(v[0]<11 || (v[0]===11 && (v[1]<5 || (v[1]===5 && v[2]<1)))) throw Error('npm 11.5.1 or newer is required')"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Pack once and require the independently reviewed CI bytes
        env:
          REVIEWED_PACKAGE_SHA256: ${{ inputs.reviewed_package_sha256 }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { createHash } = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const { inspectPackage } = require('./scripts/check-package-content.cjs');
          assert.match(process.env.REVIEWED_PACKAGE_SHA256, /^[0-9a-f]{64}$/);
          const output = 'release-artifact';
          assert.equal(fs.existsSync(output), false, 'Artifact directory must be fresh');
          fs.mkdirSync(output);
          const pack = JSON.parse(execFileSync('npm', ['pack', '--json', '--ignore-scripts', '--offline', '--pack-destination', output], { encoding: 'utf8' }));
          inspectPackage(pack);
          assert.equal(pack[0].name, 'n8n-nodes-sumwise-compute');
          assert.equal(pack[0].version, '0.1.0');
          assert.equal(pack[0].filename, 'n8n-nodes-sumwise-compute-0.1.0.tgz');
          const sha256 = createHash('sha256').update(fs.readFileSync(path.join(output, pack[0].filename))).digest('hex');
          assert.equal(sha256, process.env.REVIEWED_PACKAGE_SHA256, 'Package bytes differ from the reviewed CI artifact; publication refused');
          console.log(JSON.stringify({ filename: pack[0].filename, sha256, reviewedBytesMatch: true }));
          NODE
      - name: Publish with trusted publisher and provenance
        if: inputs.authentication == 'trusted'
        run: npm publish ./release-artifact/n8n-nodes-sumwise-compute-0.1.0.tgz --provenance --access public --tag latest --ignore-scripts
      - name: Publish only with a separately approved short-lived token
        if: inputs.authentication == 'bootstrap-token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo 'Required bootstrap secret is absent'; exit 1; }
          npm publish ./release-artifact/n8n-nodes-sumwise-compute-0.1.0.tgz --provenance --access public --tag latest --ignore-scripts
