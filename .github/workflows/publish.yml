name: Publish reviewed package
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact public main commit that has been reviewed and approved
        required: true
        type: string
      version:
        description: Exact package.json version approved for publication
        required: true
        type: string
      authentication:
        description: Trusted publisher after setup, or separately authorized first-publication token
        required: true
        type: choice
        default: trusted
        options: [trusted, bootstrap-token]
permissions:
  contents: read
concurrency:
  group: initial-npm-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'avery835/n8n-nodes-sumwise-compute' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Verify reviewed identity, ref, source and version
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const p = require('./package.json');
          assert.equal(process.env.GITHUB_REPOSITORY, 'avery835/n8n-nodes-sumwise-compute');
          assert.equal(process.env.GITHUB_REF, 'refs/heads/main');
          assert.match(process.env.REVIEWED_SHA, /^[0-9a-f]{40}$/);
          assert.equal(process.env.GITHUB_SHA, process.env.REVIEWED_SHA);
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim(), process.env.REVIEWED_SHA);
          assert.equal(p.name, 'n8n-nodes-sumwise-compute');
          assert.equal(p.version, process.env.EXPECTED_VERSION);
          assert.equal(p.repository.url, 'git+https://github.com/avery835/n8n-nodes-sumwise-compute.git');
          assert.equal(p.license, 'MIT');
          assert.notEqual(p.private, true);
          NODE
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run check:package
      - run: npm run check:source
      - name: Verify tooling and unchanged checked-out source
        run: |
          node -e "const v=require('child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if(v[0]<11 || (v[0]===11 && (v[1]<5 || (v[1]===5 && v[2]<1)))) throw Error('npm 11.5.1 or newer is required')"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Publish with trusted publisher and provenance
        if: inputs.authentication == 'trusted'
        run: npm publish --provenance --access public --tag next --ignore-scripts
      - name: First publication with separately approved short-lived token
        if: inputs.authentication == 'bootstrap-token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo 'Required bootstrap secret is absent'; exit 1; }
          npm publish --provenance --access public --tag next --ignore-scripts
